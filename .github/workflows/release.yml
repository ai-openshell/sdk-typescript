# SPDX-License-Identifier: Apache-2.0

# Releases the SDK when a stable core pin lands on main: tag and draft release,
# build, publish to npmjs.org, then attach the tarball and publish the GitHub
# release. npm trusts this file, release.yml, in the npm environment (trusted
# publishing), so the publish job needs no token and npm adds provenance.
# Pushed tags never trigger it.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to release (default the tip); the pin there must be stable
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    # Only main releases, also when the workflow is started by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the draft release
      pull-requests: read # read the merged PR's body for the release notes
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: tag
        name: Tag the release and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            sha=${INPUT_SHA:-$GITHUB_SHA}
            git merge-base --is-ancestor "$sha" "$GITHUB_SHA" || {
              echo "::error::$sha is not on main"
              exit 1
            }
            scripts/release/tag-release.sh --force --sha "$sha" >>"$GITHUB_OUTPUT"
          else
            # Compare against the commit before the push, so a pin change
            # that isn't the pushed tip still counts.
            scripts/release/tag-release.sh --since "$BEFORE" >>"$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false

      # No tool cache: what gets published is built from fresh downloads.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false

      - name: Install tools
        run: mise install --locked

      # Stamps the tag's version into package.json, builds and verifies
      # dist/ (mise run build), then packs the tarball that gets published.
      - name: Build
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          npm pkg set "version=${TAG#v}"
          mise run build
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          (cd release && sha256sum -- *.tgz) >release/openshell-sdk-checksums-sha256.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish-npm:
    name: publish-npm
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@ai-openshell/sdk
    permissions:
      id-token: write # trusted publishing to npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false

      # Only for the npm CLI; trusted publishing needs npm 11.5.1 or later,
      # which the default Node in mise.toml ships.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: false

      - name: Install Node
        run: mise install --locked node

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # A re-run after npm accepted the version skips the upload.
      - name: Publish to npm
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          if npm view "@ai-openshell/sdk@${version}" version >/dev/null 2>&1; then
            echo "@ai-openshell/sdk@${version} is on npm already."
            exit 0
          fi
          npm publish release/*.tgz --access public --ignore-scripts

  # Publishing comes last, so the release never shows without its files. If
  # this job fails after npm accepted the upload, re-run only the failed jobs.
  github-release:
    name: github-release
    needs: [tag, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attach the files and publish the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Attach the files and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber release/*
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
